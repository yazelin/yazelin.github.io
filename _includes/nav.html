<!-- _includes/nav.html -->
<header class="site-nav">
  <a class="brand" href="{{ '/' | relative_url }}"><svg class="brand-seal" viewBox="0 0 64 64" aria-hidden="true"><use href="#seal-name"/></svg><span>林亞澤</span><span class="brand-en" lang="en">{{ site.title }}</span></a>
  <nav aria-label="主選單">
    {% for item in site.navbar %}
    <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
    {% endfor %}
  </nav>
</header>
