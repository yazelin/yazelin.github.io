<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>週三晚上八點，想聽什麼？</title>
<meta name="description" content="每週三晚上八點的免費直播主題投票。最多選三個，隨時可以改，不用留任何資料。">
<meta property="og:title" content="週三晚上八點，想聽什麼？">
<meta property="og:description" content="最多選三個，隨時可以改，不用留任何資料。">
<link rel="canonical" href="https://yazelin.github.io/vote/">
<style>
/* 色票經過 dataviz 六項檢查(明度帶、彩度地板、色盲分離、常人分離、對比)，
   亮暗兩組都全過。青綠是站上 accent #047857 的同一個家族。 */
:root {
  --paper:#f4f1e8; --card:#fffdf7; --rule:#ddd6c6; --rule-soft:#e9e3d6;
  --ink:#1b2426; --ink-2:#4a545a; --ink-3:#79817f;
  --all:#00806a;          /* 大家的票 */
  --mine:#c2700d;         /* 你的票 */
  --track:#e6e0d1;
  --shadow:0 1px 0 #e3ddcd;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper:#15171a; --card:#1c1f23; --rule:#2e3339; --rule-soft:#252a2f;
    --ink:#eceef0; --ink-2:#aab2b8; --ink-3:#7d868c;
    --all:#189177; --mine:#c07f22; --track:#282d32;
    --shadow:0 1px 0 #101215;
  }
}

* { box-sizing:border-box; margin:0; padding:0; }
html { -webkit-text-size-adjust:100%; }
body {
  background:var(--paper); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  font-size:16px; line-height:1.65;
  padding:1.6rem 1.1rem 3rem; max-width:40rem; margin:0 auto;
  font-variant-numeric:tabular-nums;
}
a { color:var(--all); }
:focus-visible { outline:2px solid var(--all); outline-offset:2px; border-radius:3px; }

/* ---- 頁首 ---- */
.when { color:var(--ink-3); font-size:.82rem; letter-spacing:.02em; }
h1 { font-size:1.85rem; line-height:1.2; font-weight:800; letter-spacing:-.02em; margin:.1rem 0 .5rem; }
.sub { color:var(--ink-2); font-size:.88rem; max-width:32em; }

/* ---- 你的票 ---- */
.ballot { margin:1.5rem 0 1.8rem; }
.ballot-head {
  display:flex; align-items:baseline; justify-content:space-between; gap:.6rem;
  padding-bottom:.45rem; border-bottom:1px solid var(--rule);
}
.ballot-head strong { font-size:.9rem; font-weight:700; }
.ballot-head em { font-style:normal; color:var(--ink-3); font-size:.8rem; }
.slots { display:flex; flex-direction:column; gap:.3rem; margin-top:.55rem; }
.slot {
  min-height:2.3rem; border-radius:7px;
  display:flex; align-items:center; gap:.4rem; padding:.35rem .6rem;
  font-size:.86rem; line-height:1.35;
}
.slot.filled { background:var(--card); border:1px solid var(--mine); box-shadow:var(--shadow); }
.slot.filled span { flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; }
.slot.empty { border:1px dashed var(--rule); color:var(--ink-3); min-height:2rem; font-size:.82rem; }
.drop {
  flex:0 0 auto; border:0; background:none; cursor:pointer; padding:0 .1rem;
  color:var(--ink-3); font:inherit; font-size:1rem; line-height:1;
}
@media (hover:hover) { .drop:hover { color:var(--mine); } }

/* ---- 排行 ---- */
.section-head {
  display:flex; align-items:baseline; justify-content:space-between; gap:.6rem;
  margin:0 0 .2rem; padding-bottom:.45rem; border-bottom:1px solid var(--rule);
}
.section-head h2 { font-size:.9rem; font-weight:700; }
.key { display:flex; gap:.7rem; font-size:.74rem; color:var(--ink-3); }
.key i { display:inline-block; width:14px; height:4px; border-radius:2px; vertical-align:.12em; margin-right:.25rem; }
.key .k-all { background:var(--all); }
.key .k-mine { background:var(--mine); }

ol.rank { list-style:none; }
ol.rank li { border-bottom:1px solid var(--rule-soft); }

.row {
  width:100%; display:grid; grid-template-columns:1.9rem 1fr auto; gap:0 .6rem;
  align-items:baseline; text-align:left; cursor:pointer;
  background:none; border:0; color:inherit; font:inherit;
  padding:.6rem .1rem .5rem; position:relative;
}
@media (hover:hover) { .row:hover { background:var(--card); } }
.row .pos { grid-column:1; font-size:.9rem; font-weight:700; color:var(--ink-3); }
.row .title { grid-column:2; font-size:1rem; font-weight:700; line-height:1.35; }
.row .count { grid-column:3; font-size:.9rem; font-weight:700; color:var(--ink-2); white-space:nowrap; }
.row .track {
  grid-column:2 / span 2; height:7px; background:var(--track);
  border-radius:0 4px 4px 0; margin-top:.3rem; overflow:hidden;
}
.row .desc { grid-column:2 / span 2; font-size:.79rem; color:var(--ink-3); line-height:1.5; margin-top:.3rem; }
.row .track b { display:block; height:100%; background:var(--all); border-radius:0 4px 4px 0; transition:width .45s cubic-bezier(.2,.8,.2,1); }

.row.mine .pos { color:var(--mine); }
.row.mine .title::after { content:"　✓"; color:var(--mine); font-weight:700; }
.row.mine .count { color:var(--mine); }
.row.mine .track b { background:var(--mine); }
.row.mine::before {
  content:""; position:absolute; left:-1.1rem; top:.55rem; bottom:.45rem;
  width:3px; background:var(--mine); border-radius:0 2px 2px 0;
}
.row.blocked { opacity:.5; }

/* ---- 已排 / 已講 ---- */
.strip { display:flex; flex-direction:column; }
.strip a, .strip span {
  display:flex; gap:.7rem; align-items:baseline; text-decoration:none; color:var(--ink-2);
  padding:.3rem .1rem; border-bottom:1px solid var(--rule-soft); font-size:.83rem; line-height:1.5;
}
@media (hover:hover) { .strip a:hover { color:var(--ink); } }
.strip .d8 { color:var(--ink-3); font-size:.76rem; flex:0 0 2.9rem; }
.strip .up .d8 { color:var(--all); font-weight:700; }

h2.head { font-size:.86rem; font-weight:700; margin:1.7rem 0 .1rem; padding-bottom:.35rem; border-bottom:1px solid var(--rule); }

/* ---- 狀態 ---- */
#state { font-size:.78rem; color:var(--ink-3); min-height:1.2em; margin-top:.5rem; }
#state.ok { color:var(--all); }
#state.err { color:#c0392b; }
@media (prefers-color-scheme: dark) { #state.err { color:#f08a7d; } }

#empty { color:var(--ink-3); font-size:.88rem; padding:1.4rem .1rem; }

footer { margin-top:2.6rem; padding-top:1.1rem; border-top:1px solid var(--rule);
         color:var(--ink-3); font-size:.78rem; line-height:1.9; }

@media (prefers-reduced-motion: reduce) {
  .row .track b { transition:none; }
}
</style>
</head>
<body>

<p class="when">每週三 20:00・線上・免費</p>
<h1>想聽什麼？</h1>
<p class="sub">選三個你最想聽的，隨時可以回來換。不用留 email、不用登入。</p>

<section class="ballot">
  <div class="ballot-head">
    <strong>你的三張票</strong>
    <em id="tally-note">載入中</em>
  </div>
  <div class="slots" id="slots"></div>
  <p id="state"></p>
</section>

<div class="section-head">
  <h2>還沒排的主題</h2>
  <div class="key">
    <span><i class="k-all"></i>大家</span>
    <span><i class="k-mine"></i>你投的</span>
  </div>
</div>
<ol class="rank" id="open"></ol>
<p id="empty" hidden>還沒有人投。第一票由你開始。</p>

<h2 class="head">已經排好日期</h2>
<div class="strip" id="scheduled"></div>

<h2 class="head">已經講過的</h2>
<div class="strip" id="done"></div>

<footer>
  不收 email、不設 cookie、不記 IP。身分是你的瀏覽器自己產生的一組亂碼，存在你自己的裝置上，
  換裝置或清掉瀏覽器資料就會重新開始。<br>
  <a href="/">回首頁</a>　<a href="/events/">所有場次</a>
</footer>

<script src="topics.js"></script>
<script>
(function () {
  var API = 'https://k-rider-api.yazelinj303.workers.dev/vote';
  var MAX = 3;
  var T = window.VOTE_TOPICS || { open: [], done: [], scheduled: [] };
  var byslug = {};
  T.open.forEach(function (t) { byslug[t.slug] = t; });

  var voter = '';
  try { voter = localStorage.getItem('wed_voter') || ''; } catch (e) {}
  if (!/^[a-z0-9-]{8,64}$/.test(voter)) {
    voter = (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
          : (Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10));
    try { localStorage.setItem('wed_voter', voter); } catch (e) {}
  }

  var mine = [], tally = {}, voters = 0;
  var listEl = document.getElementById('open');
  var stateEl = document.getElementById('state');
  var noteEl = document.getElementById('tally-note');
  var emptyEl = document.getElementById('empty');
  var rows = {};            // slug -> <li>
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  function say(t, cls) { stateEl.textContent = t || ''; stateEl.className = cls || ''; }

  // 一次建好所有列,之後只更新內容與順序。這樣 FLIP 才有同一批節點可以量。
  function build() {
    T.open.forEach(function (t) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'row';
      b.innerHTML =
        '<span class="pos"></span><span class="title"></span><span class="count"></span>' +
        '<span class="track"><b></b></span><span class="desc"></span>';
      b.querySelector('.title').textContent = t.title;
      b.querySelector('.desc').textContent = t.desc;
      b.addEventListener('click', function () { toggle(t.slug); });
      li.appendChild(b);
      rows[t.slug] = li;
      listEl.appendChild(li);
    });
  }

  function ordered() {
    return T.open.slice().sort(function (a, b) {
      var d = (tally[b.slug] || 0) - (tally[a.slug] || 0);
      if (d) return d;
      return a.title.localeCompare(b.title, 'zh-Hant');
    });
  }

  // FLIP:先量舊位置,換完 DOM 再量新位置,用 transform 把它放回舊位置然後放手。
  // 這是整頁唯一的動畫——它要說的事是「你那一票把主題往上推了」。
  function reorder(list) {
    if (reduce) { list.forEach(function (t) { listEl.appendChild(rows[t.slug]); }); return; }
    var before = {};
    list.forEach(function (t) { before[t.slug] = rows[t.slug].getBoundingClientRect().top; });
    list.forEach(function (t) { listEl.appendChild(rows[t.slug]); });
    list.forEach(function (t) {
      var el = rows[t.slug];
      var dy = before[t.slug] - el.getBoundingClientRect().top;
      if (!dy) return;
      el.animate([{ transform: 'translateY(' + dy + 'px)' }, { transform: 'none' }],
                 { duration: 420, easing: 'cubic-bezier(.2,.8,.2,1)' });
    });
  }

  function render() {
    var list = ordered();
    var top = 1;
    list.forEach(function (t) { var n = tally[t.slug] || 0; if (n > top) top = n; });

    list.forEach(function (t, i) {
      var li = rows[t.slug], b = li.firstChild;
      var n = tally[t.slug] || 0;
      var on = mine.indexOf(t.slug) >= 0;
      b.className = 'row' + (on ? ' mine' : '') + (!on && mine.length >= MAX ? ' blocked' : '');
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
      b.querySelector('.pos').textContent = i + 1;
      b.querySelector('.count').textContent = n ? n + ' 票' : '—';
      b.querySelector('.track b').style.width = (n / top * 100) + '%';
    });
    reorder(list);

    var box = document.getElementById('slots');
    box.innerHTML = '';
    for (var i = 0; i < MAX; i++) {
      var d = document.createElement('div');
      var slug = mine[i];
      if (slug && byslug[slug]) {
        d.className = 'slot filled';
        var s = document.createElement('span');
        s.textContent = byslug[slug].title;
        var x = document.createElement('button');
        x.type = 'button'; x.className = 'drop'; x.textContent = '×';
        x.setAttribute('aria-label', '取消 ' + byslug[slug].title);
        x.addEventListener('click', (function (sl) { return function () { toggle(sl); }; })(slug));
        d.appendChild(s); d.appendChild(x);
      } else { continue; }
      box.appendChild(d);
    }
    if (mine.length < MAX) {
      var rest = document.createElement('div');
      rest.className = 'slot empty';
      rest.textContent = mine.length ? '還可以選 ' + (MAX - mine.length) + ' 個'
                                     : '還沒選，點下面任一個主題';
      box.appendChild(rest);
    }

    // 伺服器回來之前先把自己算進去,免得畫面上某個主題有 1 票、上面卻寫「還沒有人投」
    var shown = (mine.length && !voters) ? 1 : voters;
    noteEl.textContent = shown ? shown + ' 人投過' : '還沒有人投';
    emptyEl.hidden = shown > 0;
  }

  function renderStrip(id, list, up) {
    var box = document.getElementById(id);
    box.innerHTML = '';
    list.forEach(function (t) {
      var a = document.createElement(t.url ? 'a' : 'span');
      if (t.url) a.href = t.url;
      if (up) a.className = 'up';
      var d = document.createElement('span');
      d.className = 'd8'; d.textContent = t.date;
      a.appendChild(d);
      a.appendChild(document.createTextNode(t.title));
      box.appendChild(a);
    });
  }

  var timer = null;
  function toggle(slug) {
    var i = mine.indexOf(slug);
    if (i >= 0) {
      mine.splice(i, 1);
      tally[slug] = Math.max(0, (tally[slug] || 0) - 1);
    } else if (mine.length >= MAX) {
      say('三張票用完了。先取消一張再選。', 'err');
      return;
    } else {
      mine.push(slug);
      tally[slug] = (tally[slug] || 0) + 1;
    }
    render();                        // 先動畫面,不等伺服器
    say('儲存中…');
    clearTimeout(timer);
    timer = setTimeout(save, 400);   // 連點幾下只送一次
  }

  function apply(d) {
    if (Array.isArray(d.mine)) mine = d.mine;
    tally = d.tally || {};
    voters = d.voters || 0;
    render();
  }

  function save() {
    fetch(API, { method: 'POST', headers: { 'content-type': 'application/json' },
                 body: JSON.stringify({ voter: voter, topics: mine }) })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d.error) { say('存不進去（' + d.error + '），再按一次試試', 'err'); return; }
        apply(d); say('已存好', 'ok');
      })
      .catch(function () { say('連不上，等一下自動再試', 'err'); setTimeout(save, 4000); });
  }

  build();
  renderStrip('scheduled', T.scheduled, true);
  renderStrip('done', T.done);
  render();

  fetch(API + '?voter=' + encodeURIComponent(voter))
    .then(function (r) { return r.json(); })
    .then(function (d) { apply(d); say(''); })
    .catch(function () { say('目前票數讀不到，你的選擇還是存得進去', 'err'); });
})();
</script>
</body>
</html>
