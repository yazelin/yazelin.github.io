<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>確認頁起手檔</title>
<style>
:root { --bg:#faf9f5; --ink:#141413; --line:#e8e6dc; --accent:#c15f3c; --muted:#6b6a63; }
@media (prefers-color-scheme: dark) { :root { --bg:#141413; --ink:#faf9f5; --line:#3a3834; --accent:#d97757; --muted:#b0aea5; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.7 -apple-system, "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif; }
main { max-width: 760px; margin: 0 auto; padding: 1.5rem 1rem 4rem; }
h1 { font-size: 1.5rem; margin: 0 0 .3rem; }
.hint { color: var(--muted); font-size: .92rem; }
.card { border: 1px solid var(--line); border-radius: 10px; padding: 1rem; margin: 1rem 0; }
.card h2 { font-size: 1.05rem; margin: 0 0 .4rem; }
.card img { max-width: 100%; border-radius: 6px; }
label { margin-right: 1rem; cursor: pointer; }
input[type=text] { width: 100%; margin-top: .5rem; padding: .5rem .7rem; font: inherit; color: inherit; background: transparent; border: 1px solid var(--line); border-radius: 6px; }
button { font: inherit; padding: .6rem 1.2rem; border: 0; border-radius: 999px; background: var(--accent); color: #fff; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p class="hint">每一項選「可以」或「要重產」，想說的話寫在備註。按最下面的按鈕，回覆會下載成 feedback.json，放回原來的資料夾，叫 Claude 或 codex 讀它。</p>
  <div id="items"></div>
  <button id="save">下載回覆（feedback.json）</button>
  <span class="hint" id="msg"></span>
</main>
<script>
// 改這裡：換成你要確認的東西。img 可以留空，也可以放圖片路徑（跟這個檔放在同一個資料夾）。
const PAGE = '確認頁起手檔：把下面換成你的候選';
const ITEMS = [
  { id: 'a', name: '候選 A', text: '在這裡寫一段說明，或放一張圖。', img: '' },
  { id: 'b', name: '候選 B', text: '第二個候選。', img: '' },
  { id: 'c', name: '候選 C', text: '第三個候選。', img: '' },
];

document.getElementById('title').textContent = PAGE;
const box = document.getElementById('items');
for (const it of ITEMS) {
  const d = document.createElement('div');
  d.className = 'card';
  d.innerHTML = `<h2></h2><p></p>${it.img ? '<img alt="">' : ''}
    <label><input type="radio" name="${it.id}" value="ok"> 可以</label>
    <label><input type="radio" name="${it.id}" value="redo"> 要重產</label>
    <input type="text" placeholder="備註（可不寫）" data-note="${it.id}">`;
  d.querySelector('h2').textContent = it.name;
  d.querySelector('p').textContent = it.text;
  if (it.img) d.querySelector('img').src = it.img;
  box.append(d);
}

document.getElementById('save').onclick = () => {
  const out = { page: PAGE, savedAt: new Date().toISOString(), answers: ITEMS.map(it => ({
    id: it.id, name: it.name,
    choice: (document.querySelector(`input[name="${it.id}"]:checked`) || {}).value || '還沒決定',
    note: document.querySelector(`[data-note="${it.id}"]`).value,
  })) };
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' }));
  a.download = 'feedback.json';
  a.click();
  document.getElementById('msg').textContent = ' 已下載。';
};
</script>
</body>
</html>
